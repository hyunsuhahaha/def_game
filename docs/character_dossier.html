<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>특성 인사기록부</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --paper: #f3ead4;
    --paper-raised: #fbf5e4;
    --ink: #2b2013;
    --ink-dim: #6b5d45;
    --line: #d8c9a3;
    --line-strong: #b9a878;
    --stamp-red: #a3382c;
    --tab-inactive-fg: #7a6c50;
    --shadow: 0 1px 0 rgba(43,32,19,.06);

    --c-physical: #e0752c;
    --c-fire: #cf4636;
    --c-toxic: #5da441;
    --c-developer: #4288b8;
    --c-miner: #cca032;
    --c-philosopher: #a4c94a;
    --c-universal: #7d93a8;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1c1710;
      --paper-raised: #262019;
      --ink: #ecdfc4;
      --ink-dim: #a8987a;
      --line: #3c3020;
      --line-strong: #5a4a30;
      --stamp-red: #e2695a;
      --tab-inactive-fg: #8d7e62;
      --shadow: 0 1px 0 rgba(0,0,0,.4);

      --c-physical: #f0904e;
      --c-fire: #e2695a;
      --c-toxic: #7dc264;
      --c-developer: #6aa8d6;
      --c-miner: #e0bb52;
      --c-philosopher: #bfdc6e;
      --c-universal: #9db0c2;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1c1710;
    --paper-raised: #262019;
    --ink: #ecdfc4;
    --ink-dim: #a8987a;
    --line: #3c3020;
    --line-strong: #5a4a30;
    --stamp-red: #e2695a;
    --tab-inactive-fg: #8d7e62;
    --shadow: 0 1px 0 rgba(0,0,0,.4);

    --c-physical: #f0904e;
    --c-fire: #e2695a;
    --c-toxic: #7dc264;
    --c-developer: #6aa8d6;
    --c-miner: #e0bb52;
    --c-philosopher: #bfdc6e;
    --c-universal: #9db0c2;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .sheet {
    max-width: 1180px;
    margin: 0 auto;
    padding: 30px 24px 64px;
  }

  /* ---------- Masthead ---------- */
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    border-bottom: 3px double var(--line-strong);
    padding-bottom: 14px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .masthead-title {
    font-family: "Noto Serif KR", serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: .01em;
    margin: 0;
    text-wrap: balance;
  }
  .masthead-sub {
    margin: 4px 0 0;
    color: var(--ink-dim);
    font-size: 13.5px;
  }
  .masthead-stamp {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--stamp-red);
    border: 1.5px solid var(--stamp-red);
    padding: 5px 10px;
    border-radius: 3px;
    transform: rotate(-2deg);
    white-space: nowrap;
    letter-spacing: .04em;
  }

  /* ---------- Mode switch ---------- */
  .modeswitch {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .mode-btn {
    font-family: "Noto Serif KR", serif;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 18px;
    border: 1px solid var(--line-strong);
    border-radius: 5px;
    background: var(--paper);
    color: var(--ink-dim);
    cursor: pointer;
  }
  .mode-btn[data-active="true"] {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .mode-btn .mode-sub {
    display: block;
    font-family: "IBM Plex Mono", monospace;
    font-weight: 400;
    font-size: 10px;
    letter-spacing: .03em;
    opacity: .7;
    margin-top: 2px;
  }

  /* ---------- Search ---------- */
  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 18px;
  }
  .search-box {
    flex: 1;
    max-width: 340px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    font-family: "Noto Sans KR", sans-serif;
    font-size: 13.5px;
    padding: 9px 12px 9px 30px;
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    background: var(--paper-raised);
    color: var(--ink);
  }
  .search-box input:focus {
    outline: 2px solid var(--c-developer);
    outline-offset: 1px;
  }
  .search-box::before {
    content: "검색";
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10.5px;
    color: var(--ink-dim);
    font-family: "IBM Plex Mono", monospace;
    pointer-events: none;
  }
  .search-hint {
    font-size: 12px;
    color: var(--ink-dim);
    font-family: "IBM Plex Mono", monospace;
  }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 4px;
  }
  .tab {
    font-family: "Noto Sans KR", sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    color: var(--tab-inactive-fg);
    background: transparent;
    border: 1px solid var(--line);
    border-bottom: none;
    padding: 9px 16px 8px;
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    position: relative;
    top: 1px;
  }
  .tab[data-active="true"] {
    color: var(--ink);
    background: var(--paper-raised);
    border-color: var(--line-strong);
    box-shadow: var(--shadow);
  }
  .tab .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 7px;
    background: var(--dot);
    vertical-align: middle;
  }

  /* ---------- Panel ---------- */
  .panel {
    background: var(--paper-raised);
    border: 1px solid var(--line-strong);
    border-radius: 0 6px 6px 6px;
    padding: 20px 22px 8px;
  }
  .panel-head {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
    margin-bottom: 4px;
  }
  .panel-tagline {
    font-family: "Noto Serif KR", serif;
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .panel-doctrine {
    margin: 0;
    font-size: 12.5px;
    color: var(--ink-dim);
    max-width: 58ch;
  }
  .panel-count {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    color: var(--ink-dim);
    white-space: nowrap;
    align-self: flex-start;
    padding-top: 2px;
  }

  /* ---------- Tiers & rows ---------- */
  .tier {
    margin-top: 16px;
  }
  .tier-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--ink-dim);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .tier-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .tier-label.fusion-label { color: var(--accent, var(--stamp-red)); }
  .table-scroll { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  colgroup .col-name { width: 26%; }
  colgroup .col-effect { width: 34%; }
  colgroup .col-level { width: 10%; }
  colgroup .col-cost { width: 16%; }
  colgroup .col-req { width: 14%; }
  colgroup .col-track { width: 16%; }

  thead th {
    text-align: left;
    font-family: "IBM Plex Mono", monospace;
    font-weight: 500;
    font-size: 10.5px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--ink-dim);
    padding: 0 10px 6px;
    border-bottom: 1px solid var(--line-strong);
  }
  tbody td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.is-hidden { display: none; }
  tbody tr:hover td { background: color-mix(in srgb, var(--accent) 7%, transparent); }

  .node-name { font-weight: 600; }
  .node-short { display: block; font-size: 11.5px; color: var(--ink-dim); margin-top: 1px; }
  .capstone-badge, .signature-badge, .fusion-badge {
    display: inline-block;
    margin-left: 7px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 9.5px;
    letter-spacing: .04em;
    border-radius: 3px;
    padding: 1px 5px;
    vertical-align: middle;
  }
  .capstone-badge { color: var(--stamp-red); border: 1px solid var(--stamp-red); }
  .signature-badge, .fusion-badge { color: var(--accent); border: 1px solid var(--accent); }
  .num { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
  .cost-list { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .req-chip, .track-chip {
    display: inline-block;
    font-size: 11.5px;
    color: var(--ink-dim);
    background: color-mix(in srgb, var(--accent) 14%, var(--paper));
    border-radius: 3px;
    padding: 1px 6px;
    margin: 1px 3px 1px 0;
    white-space: nowrap;
  }
  .synergy-chip {
    display:inline-flex; align-items:center; gap:5px; margin:3px 5px 0 0; padding:2px 8px 2px 3px;
    border:1px solid var(--syn); color:var(--syn); background:color-mix(in srgb,var(--syn) 12%,transparent);
    font-size:11px; font-weight:800; letter-spacing:.04em;
  }
  .synergy-icon { width:28px; height:28px; flex:0 0 28px; image-rendering:pixelated;
    background-image:url('../assets/ui/synergy-emblems-pixel-v1.png'); background-size:196px 28px; background-repeat:no-repeat; }
  .synergy-momentum{background-position:0 0}.synergy-field{background-position:-28px 0}
  .synergy-ignition{background-position:-56px 0}.synergy-growth{background-position:-84px 0}
  .synergy-impact{background-position:-112px 0}.synergy-wild{background-position:-140px 0}
  .synergy-harvest{background-position:-168px 0}
  .branch-list { margin-top:7px; color:var(--paper-dim); font-size:12px; line-height:1.6; }
  .req-none { color: var(--ink-dim); font-size: 11.5px; }

  footer {
    margin-top: 28px;
    font-size: 11.5px;
    color: var(--ink-dim);
    text-align: center;
    font-family: "IBM Plex Mono", monospace;
  }

  @media (max-width: 720px) {
    .col-req { display: none; }
    thead th:last-child { display: none; }
  }
</style>
</head>
<body>
<div class="sheet">
  <div class="masthead">
    <div>
      <h1 class="masthead-title" id="masthead-title">특성 인사기록부</h1>
      <p class="masthead-sub" id="masthead-sub">직업별 전용 특성 6종 + 전 직군 공용 복지 특성 — LAST HAUL 벌목지 연구망 전체 목록</p>
    </div>
    <div class="masthead-stamp" id="masthead-stamp">성과 포인트 결재 완료</div>
  </div>

  <div class="modeswitch" id="modeswitch"></div>
  <div class="toolbar">
    <div class="search-box">
      <input id="search" type="text" placeholder="이름으로 찾기…" autocomplete="off">
    </div>
    <span class="search-hint" id="search-hint"></span>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"></div>

  <footer id="footer">src/character_traits.lua 기준 · 노드 순서는 선행 조건 깊이(단계) 순</footer>
</div>

<script>
/* =========================================================================
   이 파일은 저장소에 그대로 커밋되는 "1차 소스"다 — Claude 로그인 없이도 로컬에서
   바로 열리고(file:// 또는 아무 정적 서버), 다른 에이전트(Codex 등)도 일반 텍스트
   파일로 읽고 고칠 수 있다. 배포된 Claude Artifact(특성 인사기록부)는 이 파일을
   그대로 재발행한 거울본이다 — 내용을 고칠 땐 반드시 이 파일부터 고친다.

   1) 로비 특성 (영구, 성과 포인트로 구매 — src/character_traits.lua)
   ========================================================================= */
const TRAITS = {
  physical: {
    label: "생계형 나무꾼", accent: "var(--c-physical)",

    doctrine: "체력과 도끼날을 갈아 넣어 정면에서 숲을 밀어낸다.",
    nodes: [
      {id:"physical_quota",name:"일당제",short:"출근 도장",desc:"도끼질 속도 +7%",max:3,costs:[18,32,50]},
      {id:"physical_axe",name:"개인 장비 지참",short:"내 도끼",desc:"도끼 사거리 +14",max:3,costs:[22,38,58],requires:[["physical_quota",1]]},
      {id:"physical_waiver",name:"산재 포기 각서",short:"서명 완료",desc:"최대 체력 +10",max:3,costs:[22,38,58],requires:[["physical_quota",1]]},
      {id:"physical_sharpen",name:"점심시간 숫돌질",short:"날 세우기",desc:"도끼 타격 범위 +8",max:3,costs:[28,46,68],requires:[["physical_axe",1]]},
      {id:"physical_overtime",name:"무급 연장근무",short:"해 질 때까지",desc:"도끼질 속도 +5%",max:3,costs:[28,46,68],requires:[["physical_waiver",1]]},
      {id:"physical_splinter",name:"쐐기 두 개 박기",short:"동시 벌목",desc:"한 번에 타격하는 나무 +1",max:2,costs:[42,72],requires:[["physical_sharpen",2]]},
      {id:"physical_grip",name:"굳은살 손잡이",short:"묵직한 한 방",desc:"도끼 피해 +1",max:3,costs:[34,54,78],requires:[["physical_sharpen",1]]},
      {id:"physical_lunchbox",name:"식은 도시락",short:"쓰러지면 한입",desc:"나무를 벨 때 체력 +1",max:3,costs:[34,54,78],requires:[["physical_overtime",1]]},
      {id:"physical_severance",name:"퇴직금 선지급",short:"밑동 절단",desc:"타격 시 4% 확률로 즉시 벌목",max:3,costs:[42,66,92],requires:[["physical_overtime",2]]},
      {id:"physical_report",name:"초과 달성 보고서",short:"할당량 초과",desc:"런 종료 성과 포인트 +10%",max:3,costs:[38,58,84],requires:[["physical_sharpen",1],["physical_overtime",1]]},
      {id:"physical_union",name:"노조 없는 현장",short:"최종 잔업",desc:"도끼 타격 범위 +36",max:1,costs:[110],requires:[["physical_report",3]],capstone:true},
      {id:"physical_boots",name:"현장 안전화 자비 구매",short:"미끄럼 방지",desc:"최대 체력 +8",max:3,costs:[36,62,94],requires:[["physical_axe",2]]},
      {id:"physical_whetstone",name:"편의점 숫돌",short:"급한 연마",desc:"도끼 피해 +1",max:3,costs:[36,62,94],requires:[["physical_boots",1]]},
      {id:"physical_longhaft",name:"연장 손잡이 테이핑",short:"긴 자루",desc:"도끼 사거리 +12",max:3,costs:[36,62,94],requires:[["physical_boots",1]]},
      {id:"physical_grain",name:"목재 결 읽기",short:"약점 파악",desc:"즉시 벌목 확률 +3%",max:3,costs:[36,62,94],requires:[["physical_whetstone",2]]},

      {id:"physical_coffee",name:"캔커피 두 캔",short:"카페인 노동",desc:"도끼질 속도 +4%",max:3,costs:[36,62,94],requires:[["physical_waiver",2]]},
      {id:"physical_backbelt",name:"허리 보호대 돌려쓰기",short:"허리 고정",desc:"최대 체력 +9",max:3,costs:[36,62,94],requires:[["physical_coffee",1]]},
      {id:"physical_foreman",name:"작업반장 눈치",short:"손이 빨라짐",desc:"도끼질 속도 +5%",max:3,costs:[36,62,94],requires:[["physical_coffee",1]]},
      {id:"physical_scrapshield",name:"폐목재 방패",short:"임시 방호",desc:"최대 체력 +12",max:3,costs:[36,62,94],requires:[["physical_backbelt",2]]},

      {id:"physical_hydraulic",name:"유압 도끼 불법 개조",short:"압력 상승",desc:"도끼 피해 +1",max:3,costs:[36,62,94],requires:[["physical_kpi",1]]},

      {id:"physical_nohire",name:"인력 충원 계획 없음",short:"혼자 두 배",desc:"동시 타격 나무 +1",max:2,costs:[48,86],requires:[["physical_hydraulic",2]]},
      {id:"physical_erasure",name:"산재 기록 말소",short:"기록 없음",desc:"즉시 벌목 확률 +4%",max:3,costs:[36,62,94],requires:[["physical_sawback",2]]},
      {id:"physical_employee",name:"분기 최우수 사원",short:"실적 독식",desc:"성과 포인트 +12%",max:1,costs:[135],requires:[["physical_nohire",2],["physical_erasure",2]],capstone:true},
      {id:"physical_lifetime",name:"정년 없는 평생 현역",short:"최종 노동",desc:"도끼질 속도 +22%",max:1,costs:[190],requires:[["physical_employee",1]],capstone:true},
    ]
  },
  fire: {
    label: "흡연자", accent: "var(--c-fire)",
    tagline: "불씨 하나쯤은 자연이 알아서 처리하겠지.",
    doctrine: "긴 흡연 준비 끝에 꽁초를 날려 넓은 숲을 연쇄 점화한다. SPACE 도넛 연기는 캐릭터가 바라보는 방향으로 날아가는 공중 빌보드라 2.5D 바닥 기울기와 분리되어 항상 둥글게 보인다. 보이는 연기 외곽보다 후한 이동 궤적 판정으로 나무와 적을 타격하고 적을 밀어낸다.",

let mode = "skills";
let active = "fire";

function depthOf(job, id, cache) {
  if (cache[id] !== undefined) return cache[id];
  const node = job.byId[id];
  if (!node || !node.requires || node.requires.length === 0) { cache[id] = 0; return 0; }
  let d = 0;
  for (const [reqId] of node.requires) d = Math.max(d, depthOf(job, reqId, cache) + 1);
  cache[id] = d;
  return d;
}
function reqLabel(job, req) {
  const n = job.byId[req[0]];
  return (n ? n.name : req[0]) + " " + req[1] + "단계";
}

function buildModeSwitch() {
  const el = document.getElementById("modeswitch");
  el.innerHTML = Object.entries(MODE_META).map(([key, m]) =>
    `<button class="mode-btn" data-mode="${key}" data-active="${key===mode}">${m.label}<span class="mode-sub">${m.sub}</span></button>`
  ).join("");
  el.querySelectorAll(".mode-btn").forEach(btn => {
    btn.addEventListener("click", () => { mode = btn.dataset.mode; renderAll(); });
  });
}

function buildTabs() {
  const data = MODE_META[mode].data;
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = ORDER.map(key => {
    const j = data[key];
    return `<button class="tab" data-job="${key}" data-active="${key===active}" style="--dot:${j.accent}">
      <span class="dot"></span>${j.label}
    </button>`;
  }).join("");
  tabs.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => { active = btn.dataset.job; renderPanel(document.getElementById("search").value); });
  });
}

function renderTraitsPanel(job, q) {
  job.byId = job.byId || Object.fromEntries(job.nodes.map(n => [n.id, n]));
  const cache = {};
  const withDepth = job.nodes.map(n => ({...n, depth: depthOf(job, n.id, cache)}));
  withDepth.sort((a,b) => a.depth - b.depth);
  const groups = {};
  withDepth.forEach(n => { (groups[n.depth] = groups[n.depth] || []).push(n); });

  let visibleCount = 0;
  const tierLabels = ["1단계 · 시작 노드", "2단계", "3단계", "4단계", "5단계", "6단계", "7단계"];

  const tiersHtml = Object.keys(groups).sort((a,b)=>a-b).map(depth => {
    const rows = groups[depth].map(n => {
      const matches = !q || n.name.toLowerCase().includes(q) || n.short.toLowerCase().includes(q) || n.desc.toLowerCase().includes(q);
      if (matches) visibleCount++;
      const reqHtml = n.requires && n.requires.length
        ? n.requires.map(r => `<span class="req-chip">${reqLabel(job, r)}</span>`).join("")
        : `<span class="req-none">—</span>`;
      return `<tr class="${matches ? "" : "is-hidden"}">
        <td><span class="node-name">${n.name}${n.capstone ? '<span class="capstone-badge">캡스톤</span>' : ""}</span><span class="node-short">${n.short}</span></td>
        <td>${n.desc}</td>
        <td class="num">${n.max}단계</td>
        <td class="cost-list">${n.costs.join(" · ")}</td>
        <td>${reqHtml}</td>
      </tr>`;
    }).join("");
    return `<div class="tier">
      <div class="tier-label">${tierLabels[depth] || (depth+1) + "단계"}</div>
      <div class="table-scroll">
        <table style="--accent:${job.accent}">
          <colgroup><col class="col-name"><col class="col-effect"><col class="col-level"><col class="col-cost"><col class="col-req"></colgroup>
          <thead><tr><th>특성</th><th>효과</th><th>최대</th><th>비용(P)</th><th>선행 조건</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }).join("");

  return { html: tiersHtml, visibleCount };
}

function renderSkillsPanel(job, q, jobKey) {
  job.byId = job.byId || Object.fromEntries(job.nodes.map(n => [n.id, n]));
  const trackOrder = ["destroy","spread","suppress","develop","dig","venom","supplement"];
  const groups = {};
  job.nodes.forEach(n => { (groups[n.track] = groups[n.track] || []).push(n); });

  let visibleCount = 0;
  let tiersHtml = trackOrder.filter(t => groups[t]).map(track => {
    const rows = groups[track].map(n => {
      const matches = !q || n.name.toLowerCase().includes(q) || n.desc.toLowerCase().includes(q);
      if (matches) visibleCount++;
      const isSignature = SIGNATURE[jobKey] === n.id;
      const tags = (SYNERGY_TAGS[n.id] || []).map(id => `<span class="synergy-chip" style="--syn:${SYNERGIES[id].color}"><i class="synergy-icon synergy-${id}"></i>${SYNERGIES[id].name}</span>`).join("");
      const branchLabel = n.id === "molotov" ? "6레벨 무기 진화(택1) · 기존 꽁초 투척은 자동 패시브 유지" : "3레벨 전문화(택1)";
      const branches = SKILL_BRANCHES[n.id] ? `<div class="branch-list"><b>${branchLabel}</b><br>${SKILL_BRANCHES[n.id].join("<br>")}</div>` : "";
      return `<tr class="${matches ? "" : "is-hidden"}">
        <td><span class="node-name">${n.name}${isSignature ? '<span class="signature-badge" style="--accent:'+job.accent+'">전직 시그니처</span>' : ""}</span><div>${tags}</div></td>
        <td>${n.desc}${branches}</td>
      </tr>`;
    }).join("");
    return `<div class="tier">
      <div class="tier-label">${TRACK_LABEL[track]}</div>
      <div class="table-scroll">
        <table style="--accent:${job.accent}">
          <colgroup><col style="width:22%"><col style="width:78%"></colgroup>
          <thead><tr><th>스킬</th><th>효과</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }).join("");

  const synergyRows = Object.entries(SYNERGIES).map(([id,s]) => `<tr><td><span class="synergy-chip" style="--syn:${s.color}"><i class="synergy-icon synergy-${id}"></i>${s.name}</span></td><td>${s.tiers.join("<br>")}</td></tr>`).join("");
  tiersHtml = `<div class="tier"><div class="tier-label">태그 시너지 · 서로 다른 보유 스킬 수로 활성화</div><div class="table-scroll"><table><colgroup><col style="width:22%"><col style="width:78%"></colgroup><thead><tr><th>태그</th><th>활성 구간</th></tr></thead><tbody>${synergyRows}</tbody></table></div></div>` + tiersHtml;

  const fusions = FUSIONS[jobKey] || [];
  if (fusions.length) {
    const rows = fusions.map(f => {
      const matches = !q || f.name.toLowerCase().includes(q) || f.desc.toLowerCase().includes(q);
      if (matches) visibleCount++;
      const needsHtml = f.needs.map(id => {
        const n = job.byId[id];
        return `<span class="req-chip">${n ? n.name : id}</span>`;
      }).join("");
      return `<tr class="${matches ? "" : "is-hidden"}">
        <td><span class="node-name">${f.name}<span class="fusion-badge" style="--accent:${job.accent}">융합</span></span></td>
        <td>${f.desc}</td>
        <td>${needsHtml}</td>
      </tr>`;
    }).join("");
    tiersHtml += `<div class="tier">
      <div class="tier-label fusion-label" style="--accent:${job.accent}">융합 스킬 · 재료 두 스킬 모두 만렙이면 자동 획득</div>
      <div class="table-scroll">
        <table style="--accent:${job.accent}">
          <colgroup><col style="width:22%"><col style="width:52%"><col style="width:26%"></colgroup>
          <thead><tr><th>스킬</th><th>효과</th><th>재료(둘 다 MAX)</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }

  return { html: tiersHtml, visibleCount };
}

function renderPanel(filterText) {
  const data = MODE_META[mode].data;
  const job = data[active];
  const q = (filterText || "").trim().toLowerCase();
  const { html, visibleCount } = mode === "traits" ? renderTraitsPanel(job, q) : renderSkillsPanel(job, q, active);

  document.getElementById("panel").innerHTML = `
    <div class="panel-head">
      <div>
        <p class="panel-tagline">${job.tagline}</p>
        <p class="panel-doctrine">${job.doctrine}</p>
      </div>
      <div class="panel-count">${job.label} · 총 ${job.nodes.length}개</div>
    </div>
    ${html}
  `;
  document.getElementById("search-hint").textContent = q ? `${visibleCount}개 일치` : "";
}

function renderAll() {
  document.getElementById("masthead-sub").textContent = MODE_META[mode].masthead;
  document.getElementById("masthead-stamp").textContent = MODE_META[mode].stamp;
  document.getElementById("footer").textContent = mode === "traits"
    ? "src/character_traits.lua 기준 · 노드 순서는 선행 조건 깊이(단계) 순"
    : "src/clearcut_mode.lua + clearcut_synergies.lua + synergy_ui.lua + clearcut_skill_branches.lua + clearcut_fusions.lua 기준 · 흡연자 꽁초 투척 6레벨은 실제 인게임 전자담배/폭죽 무기 진화 택1, 꽁초는 자동 패시브 유지 · 연습장에서 모든 직업/공용 스킬 레벨, 무기 진화·전문화, 융합을 직접 선택 가능 · 인게임 시너지는 64px 엠블럼 아이콘만 표시하고 이름·수치·단계 설명은 호버에서만 표시 · 반복 격자 배경 미사용 · 자동 스킬 피해는 저레벨 완만/6레벨 완성 · 시너지 2개는 Lv.6, 4개는 Lv.28부터 · 씨앗 지뢰/부메랑 도끼는 3레벨에 전문화 택1";
  buildModeSwitch();
  buildTabs();
  renderPanel(document.getElementById("search").value);
}

document.getElementById("search").addEventListener("input", e => renderPanel(e.target.value));
renderAll();
</script>
</body>
</html>
